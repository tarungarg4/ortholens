      <stop offset="0%" stop-color="#0f1a2b"></stop>
      <stop offset="60%" stop-color="#0a1220"></stop>
      <stop offset="100%" stop-color="#05080f"></stop>
    </radialGradient>
    <radialGradient id="lensGlass" cx="40%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#7ee0ff" stop-opacity="0.32"></stop>
      <stop offset="45%" stop-color="#4fc3f7" stop-opacity="0.16"></stop>
      <stop offset="100%" stop-color="#0a1830" stop-opacity="0.95"></stop>
    </radialGradient>
    <linearGradient id="bone" x1="0%" y1="0%" x2="0%" y2="100%">
